<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Prediction Insights</title>
  <script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #333333;
      padding: 16px;
      margin: 0;
      background: #ffffff;
    }
    .header-title { font-size: 14px; color: #706e6b; margin-bottom: 8px; font-weight: 500; }
    
    .btn-predict {
      width: 100%;
      background-color: #0176d3;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background-color 0.2s ease;
    }
    .btn-predict:hover { background-color: #014486; }
    .btn-predict:disabled { background-color: #c9c7c5; cursor: not-allowed; }

    #results-panel { display: none; }
    .metric-value { font-size: 44px; font-weight: 700; line-height: 1; color: #2e384d; margin-bottom: 4px; }
    .metric-sub { font-size: 13px; color: #555555; margin-bottom: 18px; }
    .section-title { font-size: 12px; font-weight: 600; color: #706e6b; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .section-block { margin-bottom: 16px; }
    .list-item { display: flex; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
    .badge-icon {
      width: 15px; height: 15px; border-radius: 50%;
      background: #04844b; color: #ffffff;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; margin-right: 8px; flex-shrink: 0;
    }
    .badge-icon.negative { background: #c23934; }
    .score-green { color: #04844b; font-weight: 700; margin-right: 8px; min-width: 32px; }
    .score-red { color: #c23934; font-weight: 700; margin-right: 8px; min-width: 32px; }
    .desc { color: #4b4b4b; }
    
    .summary-box {
      background: #f8fafc;
      border-left: 3px solid #0176d3;
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #333333;
      border-radius: 0 4px 4px 0;
    }

    .data-summary-box {
      background: #f4f6f9;
      border: 1px solid #e5e9f0;
      border-radius: 4px;
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.5;
    }
    .data-summary-box table { width: 100%; border-collapse: collapse; }
    .data-summary-box td { padding: 4px 2px; }
    .data-summary-box td.label { color: #64748b; font-weight: 500; width: 45%; }
    .data-summary-box td.val { color: #1e293b; font-weight: 600; }

    .status-msg {
      margin-top: 12px;
      padding: 6px 8px;
      background: #f7f9fa;
      border-radius: 4px;
      font-size: 11px;
      color: #706e6b;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="header-title">ML Prediction Assistant</div>
  
  <button id="predict-btn" class="btn-predict" onclick="triggerPrediction()">
    Run Prediction on Selected Mark
  </button>

  <div id="results-panel">
    <div class="metric-value" id="score">--%</div>
    <div class="metric-sub" id="card-sub">Likely Outcome</div>

    <div class="section-block">
      <div class="section-title">Data Used for Prediction</div>
      <div id="model-data-container" class="data-summary-box"></div>
    </div>

    <div class="section-block">
      <div class="section-title">Top Predictors</div>
      <div id="predictors-container"></div>
    </div>

    <div class="section-block">
      <div class="section-title">How To Improve This</div>
      <div id="improvements-container"></div>
    </div>

    <div class="section-block">
      <div class="section-title">Summary</div>
      <div id="summary-container" class="summary-box"></div>
    </div>
  </div>

  <div id="status" class="status-msg">Initializing extension...</div>

  <script>
    let pooledRecords = [];
    let currentSelectedRecord = null;

    function getCleanColumnName(colMeta) {
      let name = colMeta.caption || colMeta.fieldName || "Feature";
      name = name.replace(/\[federated\.[^\]]+\]\./gi, '');
      name = name.replace(/\[(?:sum\vert{}avg\vert{}attr\vert{}min\vert{}max\vert{}count\vert{}usr):([^:\]]+)(?::[^\]]+)?\]/gi, '$1');
      name = name.replace(/[\[\]]/g, '').trim();
      return name;
    }

    function normalizeRow(columnsMeta, rowValues) {
      const record = {};
      let mName = null;
      let mVal = null;

      columnsMeta.forEach((colMeta, idx) => {
        const cleanName = getCleanColumnName(colMeta);
        const cell = rowValues[idx];
        const val = (cell && cell.value !== undefined) ? cell.value : (cell ? cell.formattedValue : null);

        if (cleanName === "Measure Names") {
          mName = val;
        } else if (cleanName === "Measure Values") {
          mVal = val;
        } else if (cleanName) {
          record[cleanName] = val;
        }
      });

      if (mName && mVal !== null && mVal !== undefined) {
        record[mName] = mVal;
      }
      return record;
    }

    tableau.extensions.initializeAsync().then(async () => {
      const dashboard = tableau.extensions.dashboardContent.dashboard;
      const statusEl = document.getElementById("status");

      async function refreshDashboardData() {
        pooledRecords = [];
        for (const sheet of dashboard.worksheets) {
          try {
            const summary = await sheet.getSummaryDataAsync();
            if (summary.data && summary.data.length > 0) {
              summary.data.forEach(row => {
                pooledRecords.push(normalizeRow(summary.columns, row));
              });
            }
          } catch (e) {}
        }
        if (pooledRecords.length > 0 && !currentSelectedRecord) {
          currentSelectedRecord = pooledRecords[0];
        }
      }

      await refreshDashboardData();
      statusEl.innerText = `Ready. ${pooledRecords.length} records loaded. Select a mark and click 'Run Prediction'.`;

      dashboard.worksheets.forEach((sheet) => {
        sheet.addEventListener(tableau.TableauEventType.MarkSelectionChanged, async (event) => {
          const marks = await event.getMarksAsync();
          if (marks.data && marks.data.length > 0 && marks.data[0].data.length > 0) {
            currentSelectedRecord = normalizeRow(marks.data[0].columns, marks.data[0].data[0]);
            statusEl.innerText = "New mark selected. Click 'Run Prediction' to evaluate.";
          }
        });
      });
    });

    async function triggerPrediction() {
      const btn = document.getElementById("predict-btn");
      const statusEl = document.getElementById("status");

      if (!pooledRecords || pooledRecords.length === 0) {
        statusEl.innerText = "No dashboard data available to predict.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Computing Prediction...";
      statusEl.innerText = "Training model and calculating feature contributions...";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            records: pooledRecords,
            selected_record: currentSelectedRecord || pooledRecords[0]
          })
        });

        const result = await response.json();
        if (result.error) {
          statusEl.innerText = result.error;
        } else {
          renderCard(result, currentSelectedRecord || pooledRecords[0]);
          document.getElementById("results-panel").style.display = "block";
          statusEl.innerText = `Evaluated against ${pooledRecords.length} workbook rows.`;
        }
      } catch (err) {
        statusEl.innerText = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Run Prediction on Selected Mark";
      }
    }

    function renderCard(data, usedRecord) {
      document.getElementById("card-sub").innerText = `Predicted: ${data.target_name || "Outcome"}`;
      document.getElementById("score").innerText = (data.likelihood !== undefined ? data.likelihood : "--") + "%";

      const dataContainer = document.getElementById("model-data-container");
      const entries = Object.entries(usedRecord || {})
        .filter(([k, v]) => v !== null && v !== undefined && k !== "Measure Names" && k !== "Measure Values")
        .slice(0, 6);

      if (entries.length > 0) {
        dataContainer.innerHTML = `<table>` + entries.map(([key, val]) => `
          <tr>
            <td class="label">${getCleanColumnName({fieldName: key})}</td>
            <td class="val">${typeof val === 'number' ? Math.round(val * 100) / 100 : val}</td>
          </tr>
        `).join('') + `</table>`;
      } else {
        dataContainer.innerText = "Single record baseline used.";
      }

      const predCont = document.getElementById("predictors-container");
      const predictors = Array.isArray(data.predictors) ? data.predictors : [];
      if (predictors.length > 0) {
        predCont.innerHTML = predictors.map(p => `
          <div class="list-item">
            <span class="badge-icon ${p.impact >= 0 ? '' : 'negative'}">▲</span>
            <span class="${p.impact >= 0 ? 'score-green' : 'score-red'}">${Math.abs(p.impact)}</span>
            <span class="desc">${p.label}</span>
          </div>
        `).join('');
      } else {
        predCont.innerHTML = `<div class="list-item"><span class="desc" style="color:#888;">No significant predictors found.</span></div>`;
      }

      const impCont = document.getElementById("improvements-container");
      const improvements = Array.isArray(data.improvements) ? data.improvements : [];
      if (improvements.length > 0) {
        impCont.innerHTML = improvements.map(i => `
          <div class="list-item">
            <span class="badge-icon">▲</span>
            <span class="score-green">${i.lift}</span>
            <span class="desc">${i.recommendation}</span>
          </div>
        `).join('');
      } else {
        impCont.innerHTML = `<div class="list-item"><span class="desc" style="color:#888;">No suggested improvements.</span></div>`;
      }

      document.getElementById("summary-container").innerText = data.summary || "Prediction generated successfully.";
    }
  </script>
</body>
</html>
